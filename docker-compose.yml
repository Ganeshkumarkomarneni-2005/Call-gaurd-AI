# =============================================================================
# CallGuard AI — Docker Compose
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: callguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: callguard
      POSTGRES_PASSWORD: callguard
      POSTGRES_DB: callguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callguard -d callguard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - callguard

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: callguard_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - callguard

  # ---------------------------------------------------------------------------
  # Backend (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: callguard_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override database URL to point to the postgres container (not localhost)
      # and use asyncpg driver for SQLAlchemy async
      DATABASE_URL: postgresql+asyncpg://callguard:callguard@postgres:5432/callguard
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend:ro
      - ./ml:/app/ml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - callguard

  # ---------------------------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars must be passed at BUILD TIME — Next.js inlines
        # them into the JavaScript bundle during `npm run build`.
        # The browser fetches the backend directly on port 8000 (exposed to
        # the host), so we use localhost:8000 here.
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    container_name: callguard_frontend
    restart: unless-stopped
    environment:
      # Runtime env vars for the Node.js server process (server-side rendering).
      # These are separate from the build-time NEXT_PUBLIC_* vars above.
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - callguard

# =============================================================================
# Networks
# =============================================================================
networks:
  callguard:
    name: callguard
    driver: bridge

# =============================================================================
# Named Volumes
# =============================================================================
volumes:
  postgres_data:
    name: callguard_postgres_data
  redis_data:
    name: callguard_redis_data
